name: Test generated C

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Translate and verify examples
        run: |
          python -m pyc_transpiler verify examples/basics.py --compiler gcc
          python -m pyc_transpiler verify examples/fizzbuzz.py --compiler gcc
